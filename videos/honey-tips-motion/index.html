<!doctype html>
<html lang="ko" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Pretendard";
        font-weight: 900;
        src: url("assets/fonts/Pretendard-Black.subset.woff2") format("woff2");
      }
      @font-face {
        font-family: "Pretendard";
        font-weight: 800;
        src: url("assets/fonts/Pretendard-ExtraBold.subset.woff2") format("woff2");
      }
      @font-face {
        font-family: "Pretendard";
        font-weight: 600;
        src: url("assets/fonts/Pretendard-SemiBold.subset.woff2") format("woff2");
      }
      @font-face {
        font-family: "Pretendard";
        font-weight: 500;
        src: url("assets/fonts/Pretendard-Medium.subset.woff2") format("woff2");
      }

      :root {
        --honey: #ffb703;
        --amber: #fb8500;
        --ink: #f5efe6;
        --muted: #a39a8e;
        --surface: #26201b;
        --bg: #14110e;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg);
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: "Pretendard", sans-serif;
        color: var(--ink);
      }

      #main-clip {
        position: absolute;
        inset: 0;
      }

      /* Decorative warm glow behind the title */
      .glow {
        position: absolute;
        left: 50%;
        top: 520px;
        width: 1100px;
        height: 1100px;
        margin-left: -550px;
        margin-top: -550px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 183, 3, 0.16) 0%, rgba(255, 183, 3, 0) 62%);
      }

      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 96px;
        padding: 200px 90px 260px;
      }

      .title-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        text-align: center;
      }
      .kicker {
        font-size: 34px;
        font-weight: 600;
        letter-spacing: 0.32em;
        color: var(--honey);
        margin-bottom: 24px;
      }
      .title-line {
        display: block;
        font-size: 132px;
        font-weight: 900;
        line-height: 1.12;
        letter-spacing: -0.04em;
        will-change: transform, filter, opacity;
      }
      .accent {
        position: relative;
        isolation: isolate;
        color: var(--honey);
      }
      .underline {
        position: absolute;
        left: -6px;
        right: -6px;
        bottom: 6px;
        height: 22px;
        border-radius: 11px;
        background: var(--amber);
        opacity: 0.45;
        z-index: -1;
        transform-origin: left center;
      }

      .cards {
        display: flex;
        flex-direction: column;
        gap: 36px;
      }
      .card {
        display: flex;
        align-items: center;
        gap: 40px;
        padding: 40px 48px;
        border-radius: 40px;
        background: var(--surface);
        border: 2px solid rgba(255, 183, 3, 0.18);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }
      .badge {
        flex: 0 0 auto;
        width: 128px;
        height: 128px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, var(--honey), var(--amber));
        color: var(--bg);
        font-size: 72px;
        font-weight: 900;
        line-height: 1;
      }
      .card-text {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 0;
      }
      .card-title {
        font-size: 56px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.2;
      }
      .card-sub {
        font-size: 36px;
        font-weight: 500;
        color: var(--muted);
        letter-spacing: -0.02em;
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <div id="main-clip" class="clip" data-start="0" data-duration="10" data-track-index="0">
        <div class="glow"></div>
        <div class="stage">
          <div class="title-block">
            <div class="kicker">TODAY'S TIPS</div>
            <span class="title-line" id="title-1">오늘의 <span class="accent">꿀팁<span class="underline"></span></span></span>
            <span class="title-line" id="title-2">3가지</span>
          </div>

          <div class="cards">
            <div class="card" id="card-1">
              <div class="badge">1</div>
              <div class="card-text">
                <div class="card-title">아침엔 물 한 잔부터</div>
                <div class="card-sub">공복 수분 보충으로 몸을 깨워요</div>
              </div>
            </div>
            <div class="card" id="card-2">
              <div class="badge">2</div>
              <div class="card-text">
                <div class="card-title">25분 집중, 5분 휴식</div>
                <div class="card-sub">뽀모도로로 집중력을 오래 유지해요</div>
              </div>
            </div>
            <div class="card" id="card-3">
              <div class="badge">3</div>
              <div class="card-text">
                <div class="card-title">자기 전 30분 화면 끄기</div>
                <div class="card-sub">블루라이트를 줄이면 잠이 깊어져요</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Hook: focus-blur-resolve recipe — blur + slight scale resolve to crisp, line by line.
      tl.fromTo(".glow", { autoAlpha: 0, scale: 0.8 }, { autoAlpha: 1, scale: 1, duration: 1.6, ease: "sine.out" }, 0);
      tl.fromTo(".kicker", { autoAlpha: 0, filter: "blur(12px)" }, { autoAlpha: 1, filter: "blur(0px)", duration: 0.8, ease: "power3.out" }, 0.1);
      tl.fromTo(
        ".title-line",
        { autoAlpha: 0, scale: 1.08, filter: "blur(28px)" },
        { autoAlpha: 1, scale: 1, filter: "blur(0px)", duration: 1.2, stagger: 0.25, ease: "power3.out" },
        0.2,
      );
      tl.fromTo(".underline", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 1.6);

      // Build: spring-pop recipe — back.out overshoot from a visible near-rest scale.
      const cardTimes = [2.2, 3.0, 3.8];
      cardTimes.forEach((t, i) => {
        const card = `#card-${i + 1}`;
        tl.fromTo(card, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3, ease: "power2.out" }, t);
        tl.fromTo(card, { scale: 0.86, y: 60 }, { scale: 1, y: 0, duration: 0.6, ease: "back.out(1.7)" }, t);
        tl.fromTo(
          `${card} .badge`,
          { scale: 0.4, rotation: -20 },
          { scale: 1, rotation: 0, duration: 0.55, ease: "back.out(2.2)" },
          t + 0.12,
        );
      });

      // Punch: glow ripple across the badges, then a slow breath on the whole stack.
      [6.2, 6.5, 6.8].forEach((t, i) => {
        tl.to(`#card-${i + 1} .badge`, { scale: 1.12, duration: 0.18, yoyo: true, repeat: 1, ease: "sine.inOut" }, t);
        tl.to(
          `#card-${i + 1}`,
          { borderColor: "rgba(255, 183, 3, 0.7)", duration: 0.18, yoyo: true, repeat: 1, ease: "sine.inOut" },
          t,
        );
      });
      tl.to(".stage", { scale: 1.015, duration: 2.2, ease: "sine.inOut" }, 7.1);

      // Resolve: fade everything out to the background.
      tl.to(".stage, .glow", { autoAlpha: 0, duration: 0.6, ease: "power2.in" }, 9.3);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
